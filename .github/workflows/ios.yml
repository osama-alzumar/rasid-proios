name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: RasidKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: swift test --package-path RasidKit

  app:
    name: Build, UI tests, screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: UI tests on iPhone and iPad
        run: |
          set -o pipefail
          for target in "iPhone.*Pro Max:iphone" "iPad Pro.*13:ipad"; do
            pattern="${target%%:*}"; label="${target##*:}"
            udid=$(ci/pick-simulator.sh "$pattern")
            xcodebuild test -project Rasid.xcodeproj -scheme Rasid \
              -destination "id=$udid" -resultBundlePath "build/$label.xcresult" \
              CODE_SIGNING_ALLOWED=NO | tail -n 60
          done
      - name: Export screenshots
        if: always()
        run: |
          for label in iphone ipad; do
            [ -d "build/$label.xcresult" ] || continue
            mkdir -p "screenshots/$label"
            xcrun xcresulttool export attachments --path "build/$label.xcresult" --output-path "screenshots/$label" || true
          done
          ls -R screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

  testflight:
    name: Archive & upload to TestFlight
    needs: [kit, app]
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Install signing certificate and profile
        env:
          P12: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/rasid.keychain-db
          KC_PASS=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$dir"
          echo "$PROFILE" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          uuid=$(security cms -D -i $RUNNER_TEMP/app.mobileprovision | plutil -extract UUID raw -)
          cp $RUNNER_TEMP/app.mobileprovision "$dir/$uuid.mobileprovision"
          security find-identity -v -p codesigning "$KC"
      - name: Write API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -project Rasid.xcodeproj -scheme Rasid \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/Rasid.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -n 80
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Rasid.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 80
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/private_keys $RUNNER_TEMP/dist.p12 $RUNNER_TEMP/app.mobileprovision
          security delete-keychain $RUNNER_TEMP/rasid.keychain-db || true
