name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests & signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Write keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Test core, build release + debug
        env:
          RASID_KEYSTORE: ${{ runner.temp }}/release.p12
          RASID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RASID_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :core:test :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" rasid.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: rasid-apk
          path: rasid.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: android/core/build/reports/tests

  ui:
    name: UI tests on emulator + screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell rm -rf /sdcard/rasid-shots
            gradle -p android :app:connectedDebugAndroidTest --no-daemon
            mkdir -p screenshots && adb pull /sdcard/rasid-shots/. screenshots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: |
            screenshots
            android/app/build/reports/androidTests
